<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pocket Split</title>
<meta name="theme-color" content="#1A73E8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket Split">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #F3F6FB;
    --surface: #FFFFFF;
    --surface-sunken: #EDF2FA;

    --blue-600: #1A73E8;
    --blue-700: #1557B0;
    --blue-tint: #E8F0FE;
    --blue-tint-border: #D2E3FC;

    --ink: #202124;
    --ink-dim: #5F6368;
    --ink-faint: #9AA0A6;
    --border: #E3E7EE;
    --border-soft: #EDF0F5;

    --owed: #188038;
    --owe: #D9463A;
    --amber: #B06000;

    --p1: #4285F4; --p2: #7C4DFF; --p3: #F4B400; --p4: #00ACC1;
    --p5: #EC407A; --p6: #FF7043; --p7: #5C6BC0; --p8: #26C6DA;

    --shadow-sm: 0 1px 2px rgba(32,33,36,0.06), 0 1px 6px rgba(32,33,36,0.05);
    --shadow-md: 0 2px 6px rgba(32,33,36,0.07), 0 4px 16px rgba(32,33,36,0.06);
    --shadow-lg: 0 8px 30px rgba(26,115,232,0.16);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg-0); margin: 0; }
  #app-root, #app-root * { box-sizing: border-box; }

  #app-root {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    background:
      radial-gradient(520px 320px at 10% -6%, rgba(66,133,244,0.10), transparent 60%),
      radial-gradient(460px 320px at 100% 4%, rgba(124,77,255,0.07), transparent 55%),
      var(--bg-0);
    overflow-x: hidden;
  }

  .display { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 800; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) rotate(var(--rot)); }
    50% { transform: translate(4px,-5px) rotate(calc(var(--rot) + 2deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .fan-card { animation: none !important; } }

  .header { padding: 30px 20px 18px; position: relative; }
  .fan-stack { position: absolute; top: 6px; right: 18px; width: 96px; height: 66px; z-index: 0; }
  .fan-card {
    position: absolute; width: 46px; height: 62px; border-radius: 12px; top: 0; left: 26px;
    box-shadow: var(--shadow-md); --rot: 0deg; animation: drift 5.5s ease-in-out infinite;
  }
  .fan-card:nth-child(1) { background: linear-gradient(155deg, var(--p1), #1967D2); --rot: -18deg; transform: rotate(-18deg); z-index: 1; }
  .fan-card:nth-child(2) { background: linear-gradient(155deg, var(--p2), #5B21D6); --rot: -6deg; transform: rotate(-6deg); z-index: 2; animation-delay: 0.4s; }
  .fan-card:nth-child(3) { background: linear-gradient(155deg, var(--p3), #C88A00); --rot: 6deg; transform: rotate(6deg); z-index: 3; animation-delay: 0.8s; }
  .fan-card:nth-child(4) { background: linear-gradient(155deg, var(--p4), #007C91); --rot: 18deg; transform: rotate(18deg); z-index: 4; animation-delay: 1.2s; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--blue-600); font-weight: 600;
    margin: 0 0 6px; position: relative; z-index: 2;
  }
  .brand-title { font-size: 32px; margin: 0; letter-spacing: -0.02em; color: var(--ink); position: relative; z-index: 2; width: fit-content; }
  .trip-name-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 4px 0 0; position: relative; z-index: 2;
  }
  .trip-name-tag { font-size: 14px; font-weight: 600; color: var(--ink-dim); margin: 0; }
  .switch-group-link {
    display: inline-flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 11px; box-shadow: var(--shadow-sm);
    color: var(--blue-600); font-size: 11px; font-weight: 700;
    text-decoration: none; cursor: pointer; margin-left: auto; flex-shrink: 0;
  }
  .header-controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 2; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px;
    letter-spacing: 0.05em; color: var(--ink-dim); box-shadow: var(--shadow-sm);
  }
  .pill strong { color: var(--ink); }
  .pill button { background: none; border: none; color: var(--blue-600); opacity: 0.9; cursor: pointer; font-size: 11.5px; padding: 0; text-decoration: underline; font-weight: 600; }
  select.pill { -webkit-appearance: none; appearance: none; cursor: pointer; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--owed); margin-right: 5px; box-shadow: 0 0 0 3px rgba(24,128,56,0.15); }
  .live-dot.offline { background: var(--owe); box-shadow: 0 0 0 3px rgba(217,70,58,0.15); }

  .body-pad { padding: 6px 20px 112px; position: relative; z-index: 1; }

  .gate { padding: 46px 24px; position: relative; z-index: 2; }
  .gate .fan-stack { top: -6px; right: 8px; }
  .gate h2 { font-size: 24px; margin: 18px 0 8px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
  .gate p { font-size: 14px; color: var(--ink-dim); margin: 0 0 26px; line-height: 1.55; }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-faint); margin-bottom: 7px; display: block; font-weight: 700; }
  input[type="text"], input[type="number"] {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 15px; padding: 13px 14px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink);
    outline: none;
  }
  input::placeholder { color: var(--ink-faint); }
  input:focus { border-color: var(--blue-600); box-shadow: 0 0 0 3px var(--blue-tint); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 700;
    padding: 13px 18px; border-radius: 12px; border: none; cursor: pointer; width: 100%;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--blue-600); color: #fff; box-shadow: var(--shadow-lg); }
  .btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); }
  .btn-stamp { background: var(--ink); color: #fff; font-weight: 700; box-shadow: var(--shadow-md); }
  .or-divider { display: flex; align-items: center; gap: 10px; margin: 22px 0; color: var(--ink-faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 13px; cursor: pointer; box-shadow: var(--shadow-sm);
  }
  .history-item:active { background: var(--surface-sunken); }
  .history-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .history-name { font-size: 14.5px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-meta { font-size: 11px; color: var(--ink-faint); }
  .history-remove {
    background: var(--surface-sunken); border: none; border-radius: 50%;
    width: 24px; height: 24px; flex-shrink: 0; color: var(--ink-faint);
    cursor: pointer; font-size: 14px; line-height: 24px; text-align: center; padding: 0;
  }

  .glass-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px 18px 10px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
  .total-spend-row { display: flex; justify-content: space-between; align-items: baseline; }
  .total-spend-label { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
  .total-spend-amt { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
  .total-spend-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }

  .glass-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin: 0 0 12px; font-weight: 700; }
  .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--border-soft); gap: 10px; }
  .balance-row:first-of-type { border-top: none; }
  .person-tag { display: flex; align-items: center; gap: 9px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .balance-name { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .balance-amt { font-size: 15.5px; font-weight: 700; white-space: nowrap; }
  .amt-positive { color: var(--owed); }
  .amt-negative { color: var(--owe); }
  .amt-zero { color: var(--ink-faint); }

  .settle-list { margin: 14px 0 4px; }
  .settle-item { display: flex; align-items: center; gap: 8px; font-size: 13.5px; background: var(--blue-tint); border: 1px solid var(--blue-tint-border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); }
  .settle-arrow { color: var(--blue-600); }
  .settle-amt { margin-left: auto; font-weight: 700; color: var(--blue-700); }

  .section-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); margin: 26px 2px 12px; display: flex; align-items: center; gap: 8px; }
  .section-title .count { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; font-size: 11px; color: var(--ink-dim); box-shadow: var(--shadow-sm); }
  .archive-link {
    display: inline-flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 11px; box-shadow: var(--shadow-sm);
    color: var(--blue-600); font-size: 11px; font-weight: 700;
    text-decoration: none; cursor: pointer; text-transform: none; letter-spacing: normal;
  }
  .archived-item {
    background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 10px; opacity: 0.85;
  }
  .archived-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .archived-desc { font-size: 14.5px; font-weight: 600; color: var(--ink-dim); text-decoration: line-through; }
  .archived-amt { font-size: 14.5px; font-weight: 700; color: var(--ink-faint); }
  .archived-meta { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
  .restore-btn {
    background: none; border: none; color: var(--blue-600); font-size: 11.5px; font-weight: 700;
    text-decoration: underline; cursor: pointer; padding: 0; margin-top: 8px;
  }

  .people-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 10px 6px 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); box-shadow: var(--shadow-sm); }
  .chip .avatar { width: 22px; height: 22px; font-size: 10.5px; }
  .chip button { background: var(--surface-sunken); border: none; border-radius: 50%; width: 18px; height: 18px; line-height: 18px; text-align: center; color: var(--ink-dim); cursor: pointer; padding: 0; font-size: 11px; }
  .add-person-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-person-row input { flex: 1; }
  .add-person-row button { flex-shrink: 0; background: var(--blue-600); color: #fff; border: none; border-radius: 12px; padding: 0 18px; font-weight: 700; font-size: 19px; cursor: pointer; box-shadow: var(--shadow-md); }

  .expense-ticket { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow-sm); cursor: pointer; }
  .expense-ticket:active { background: var(--surface-sunken); }
  .expense-confirm-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .expense-confirm-text { font-size: 11.5px; color: var(--owe); font-weight: 600; }
  .expense-del.confirm { color: var(--owe); font-weight: 700; }
  .chip .confirm-yes { background: var(--owed); color: #fff; }
  .expense-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .expense-desc { font-size: 15px; font-weight: 600; color: var(--ink); }
  .expense-amt { font-size: 15px; font-weight: 700; white-space: nowrap; color: var(--blue-700); }
  .expense-meta { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; line-height: 1.5; }
  .expense-meta strong { color: var(--ink); }
  .expense-fx-note { font-size: 11.5px; color: var(--blue-700); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .expense-del { background: none; border: none; color: var(--ink-faint); font-size: 11.5px; cursor: pointer; text-decoration: underline; margin-top: 8px; padding: 0; }

  .empty-state { text-align: center; padding: 34px 14px; color: var(--ink-faint); font-size: 13.5px; border: 1.5px dashed var(--border); border-radius: 16px; background: var(--surface-sunken); }

  .fab { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 40px)); z-index: 20; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(32,33,36,0.32); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal-sheet { background: var(--surface); border: 1px solid var(--border); border-bottom: none; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 24px 20px 28px; max-height: 86vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(32,33,36,0.12); }
  .modal-sheet h3 { margin: 0 0 18px; font-size: 19px; font-weight: 800; color: var(--ink); }
  .field { margin-bottom: 18px; }
  .amount-currency-row { display: flex; gap: 8px; align-items: stretch; }
  .convert-hint { font-size: 12px; color: var(--blue-700); margin-top: 8px; }
  .convert-error { font-size: 12px; color: var(--owe); margin-top: 8px; font-weight: 600; }
  .payer-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .select-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px 8px 8px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink); }
  .select-chip.active { background: var(--blue-tint); border-color: var(--blue-600); color: var(--blue-700); }
  .split-list { display: flex; flex-direction: column; gap: 2px; }
  .split-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border-soft); font-size: 14px; font-weight: 600; color: var(--ink); }
  .split-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue-600); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { width: auto; flex: 1; }

  .currency-picker-backdrop { z-index: 60; }
  .currency-picker-sheet { display: flex; flex-direction: column; max-height: 80vh; }
  .currency-scroll { overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
  .currency-group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    color: var(--ink-faint); margin: 4px 0 6px;
  }
  .currency-divider { height: 1px; background: var(--border); margin: 10px 0 12px; }
  .currency-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; text-align: left; cursor: pointer;
    padding: 10px 6px; border-radius: 10px; font-size: 14px; color: var(--ink);
  }
  .currency-row:active { background: var(--surface-sunken); }
  .currency-row.picked { background: var(--blue-tint); }
  .currency-row:disabled { cursor: not-allowed; }
  .currency-row-symbol { width: 34px; flex-shrink: 0; color: var(--ink-dim); font-size: 13px; }
  .currency-row-check { width: 20px; flex-shrink: 0; color: var(--blue-600); font-weight: 800; font-size: 15px; text-align: center; }
  .currency-row-code { width: 46px; flex-shrink: 0; font-weight: 700; }
  .currency-row-name { color: var(--ink-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .manage-currencies-hint { font-size: 13px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 16px; }

  .invite-pill { background: var(--blue-600); border-color: var(--blue-600); color: #fff; font-weight: 700; }
  .invite-option-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .settings-option-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .settings-option-value { color: var(--ink-faint); font-size: 13px; font-weight: 600; }

  .tab-bar {
    display: flex; gap: 4px; background: var(--surface-sunken); border-radius: 14px;
    padding: 4px; margin: 4px 0 22px; position: relative; z-index: 1;
  }
  .tab-btn {
    flex: 1; background: none; border: none; padding: 10px 8px; border-radius: 11px;
    font-size: 13.5px; font-weight: 700; color: var(--ink-dim); cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  .settings-gear-btn {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow-sm); font-size: 17px; flex-shrink: 0;
  }

  .spend-chart { margin: 16px 0 4px; }
  .spend-chart-row { margin-bottom: 12px; }
  .spend-chart-labels { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .spend-chart-name { font-weight: 600; color: var(--ink); }
  .spend-chart-amt { color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
  .spend-chart-track { background: var(--surface-sunken); border-radius: 8px; height: 10px; overflow: hidden; }
  .spend-chart-fill { height: 100%; border-radius: 8px; }
  .invite-option {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 13px 15px; font-size: 14.5px; font-weight: 600; color: var(--ink);
    text-decoration: none; cursor: pointer; width: 100%; text-align: left;
  }
  .invite-option:active { background: var(--surface-sunken); }
  .link-box {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-dim);
    background: var(--surface-sunken); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 10px 11px; word-break: break-all; margin-bottom: 4px;
  }
  .pinned-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .add-currency-btn {
    background: var(--blue-tint); border: 1.5px dashed var(--blue-tint-border); color: var(--blue-700);
    border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }

  .currency-select-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 0 12px; height: 48px; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 14px; color: var(--ink); cursor: pointer; flex-shrink: 0;
  }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 20px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    box-shadow: 0 10px 30px rgba(32,33,36,0.25); max-width: calc(100% - 40px); text-align: center;
  }
  .toast.show { opacity: 1; }

  .setup-warning {
    margin: 20px; padding: 16px; background: #FEF3E0; border: 1px solid #F4B400;
    border-radius: 12px; font-size: 13px; color: #7A5300; line-height: 1.5;
  }
  .setup-warning code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app-root"></div>

function lastCurrencyKey(tripCode) { return `pocketSplitLastCurrency:${tripCode}`; }
function getLastUsedCurrency(tripCode) {
  try { return localStorage.getItem(lastCurrencyKey(tripCode)); } catch (e) { return null; }
}
function setLastUsedCurrency(tripCode, code) {
  try { localStorage.setItem(lastCurrencyKey(tripCode), code); } catch (e) {}
}

const PERSON_COLORS = ['--p1', '--p2', '--p3', '--p4', '--p5', '--p6', '--p7', '--p8'];
function colorForPerson(name, people) {
  const idx = people.indexOf(name);
  return `var(${PERSON_COLORS[idx % PERSON_COLORS.length]})`;
}
function initials(name) { return name.trim().slice(0, 2).toUpperCase(); }
function symbolFor(code) { return CURRENCY_MAP[code] ? CURRENCY_MAP[code].symbol : '$'; }
function nameFor(code) { return CURRENCY_MAP[code] ? CURRENCY_MAP[code].name : code; }
function fmt(n, symbol) {
  const sign = n < 0 ? '-' : '';
  return sign + (symbol || '$') + Math.abs(n).toFixed(2);
}

function simplifySettlements(balances) {
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([name, amt]) => {
    if (amt > 0.005) creditors.push({ name, amt });
    else if (amt < -0.005) debtors.push({ name, amt: -amt });
  });
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    if (pay > 0.005) txns.push({ from: debtors[i].name, to: creditors[j].name, amt: pay });
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt < 0.005) i++;
    if (creditors[j].amt < 0.005) j++;
  }
  return txns;
}

function CurrencyPickerModal({ pinned = [], excludeCodes = [], onSelect, onSelectMultiple, onClose, title, multiSelect = false, existingCount = 0, maxSelect = 5 }) {
  const [query, setQuery] = useState('');
  const [picked, setPicked] = useState([]);
  const q = query.trim().toLowerCase();

  const matches = (c) => !q || c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q);
  const available = CURRENCIES.filter((c) => !excludeCodes.includes(c.code));
  const filtered = available.filter(matches);

  const pinnedSet = new Set(pinned);
  const pinnedList = filtered.filter((c) => pinnedSet.has(c.code));
  const restList = filtered
    .filter((c) => !pinnedSet.has(c.code))
    .sort((a, b) => a.code.localeCompare(b.code));

  const atLimit = existingCount + picked.length >= maxSelect;

  const togglePick = (code) => {
    setPicked((prev) => {
      if (prev.includes(code)) return prev.filter((c) => c !== code);
      if (atLimit) return prev; // already at the cap, ignore further taps
      return [...prev, code];
    });
  };

  const Row = (c) => {
    if (!multiSelect) {
      return (
        <button key={c.code} className="currency-row" onClick={() => onSelect(c.code)}>
          <span className="currency-row-symbol mono">{c.symbol}</span>
          <span className="currency-row-code mono">{c.code}</span>
          <span className="currency-row-name">{c.name}</span>
        </button>
      );
    }
    const isPicked = picked.includes(c.code);
    const disabled = !isPicked && atLimit;
    return (
      <button
        key={c.code}
        className={'currency-row' + (isPicked ? ' picked' : '')}
        onClick={() => togglePick(c.code)}
        disabled={disabled}
        style={disabled ? { opacity: 0.4 } : undefined}
      >
        <span className="currency-row-check">{isPicked ? '✓' : ''}</span>
        <span className="currency-row-code mono">{c.code}</span>
        <span className="currency-row-name">{c.name}</span>
      </button>
    );
  };

  return (
    <div className="modal-backdrop currency-picker-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet currency-picker-sheet">
        <h3 className="display">{title || 'Choose a currency'}</h3>
        {multiSelect && (
          <p className="manage-currencies-hint" style={{marginTop: -8}}>
            Tap to select up to {maxSelect} total{existingCount > 0 ? ` (${existingCount} already added)` : ''}, then tap Done.
          </p>
        )}
        <input
          type="text"
          placeholder="Search by name or code…"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          autoFocus
          style={{ marginBottom: 14 }}
        />
        <div className="currency-scroll">
          {pinnedList.length > 0 && (
            <>
              <div className="currency-group-label">Pinned for this trip</div>
              {pinnedList.map(Row)}
              <div className="currency-divider"></div>
            </>
          )}
          {restList.length > 0 ? (
            restList.map(Row)
          ) : pinnedList.length === 0 ? (
            <div className="empty-state">No currencies match "{query}"</div>
          ) : null}
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          {multiSelect && (
            <button
              className="btn btn-primary"
              disabled={picked.length === 0}
              onClick={() => onSelectMultiple(picked)}
            >
              Done{picked.length > 0 ? ` (${picked.length})` : ''}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function ManageCurrenciesModal({ pinned, onSave, onClose }) {
  const [list, setList] = useState([...pinned]);
  const [showPicker, setShowPicker] = useState(false);

  const remove = (code) => setList((prev) => prev.filter((c) => c !== code));
  const addMany = (codes) => {
    setList((prev) => [...prev, ...codes.filter((c) => !prev.includes(c))].slice(0, 5));
    setShowPicker(false);
  };

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet">
        <h3 className="display">Group currencies</h3>
        <p className="manage-currencies-hint">
          Pin up to 5 currencies your group uses most — they'll show first whenever anyone picks a currency here. Add, remove, or change these anytime.
        </p>
        <div className="pinned-chip-row">
          {list.map((code) => (
            <div className="chip" key={code}>
              <span className="mono">{code}</span>
              <button onClick={() => remove(code)}>×</button>
            </div>
          ))}
          {list.length < 5 && (
            <button className="add-currency-btn" onClick={() => setShowPicker(true)}>+ Add</button>
          )}
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={() => onSave(list)}>Save</button>
        </div>
      </div>
      {showPicker && (
        <CurrencyPickerModal
          excludeCodes={list}
          existingCount={list.length}
          maxSelect={5}
          multiSelect
          title="Add currencies"
          onSelectMultiple={addMany}
          onClose={() => setShowPicker(false)}
        />
      )}
    </div>
  );
}

function InviteFallbackModal({ url, text, showToast, onClose }) {
  const waLink = `https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`;
  const mailLink = `mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(text + '\n\n' + url)}`;
  const smsLink = `sms:?&body=${encodeURIComponent(text + ' ' + url)}`;

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(url);
      showToast('Link copied');
      onClose();
    } catch (e) {
      showToast("Couldn't copy — long-press the link below to copy it manually");
    }
  };

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet">
        <h3 className="display">Invite to this trip</h3>

          <a className="invite-option" href={waLink} target="_blank" rel="noopener noreferrer" onClick={onClose}>
            <span>WhatsApp</span>
          </a>
          <a className="invite-option" href={mailLink} onClick={onClose}>
            <span>Email</span>
          </a>
          <a className="invite-option" href={smsLink} onClick={onClose}>
            <span>Message (SMS)</span>
          </a>
          <button className="invite-option" onClick={copyLink}>

          </button>
        </div>
        <div className="link-box">{url}</div>

        </div>
      </div>

}

  } catch (e) {
    return [];
  }
}

function saveTripHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
}

function timeAgo(ts) {
  if (!ts) return '';
  const diffMs = Date.now() - ts;
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  if (days < 30) return `${days}d ago`;
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
}

function App() {
  const [fbReady, setFbReady] = useState(false);
  const [tripCode, setTripCode] = useState(() => {
    try { return localStorage.getItem(STORAGE_KEY) || null; } catch (e) { return null; }
  });
  const [codeInput, setCodeInput] = useState('');
  const [newTripName, setNewTripName] = useState('');
  const [newTripCurrencies, setNewTripCurrencies] = useState([]);
  const [showNewTripCurrencyPicker, setShowNewTripCurrencyPicker] = useState(false);
  const [showHeaderCurrencyPicker, setShowHeaderCurrencyPicker] = useState(false);
  const [showManageCurrencies, setShowManageCurrencies] = useState(false);
  const [showArchive, setShowArchive] = useState(false);
  const [showInviteFallback, setShowInviteFallback] = useState(false);
  const [activeTab, setActiveTab] = useState('summary');
  const [showTripSettings, setShowTripSettings] = useState(false);
  const [tripHistory, setTripHistory] = useState(() => loadTripHistory());
  const [loading, setLoading] = useState(false);
  const [trip, setTrip] = useState(null);
  const [toast, setToast] = useState('');
  const [showAddExpense, setShowAddExpense] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [confirmDeletePerson, setConfirmDeletePerson] = useState(null);
  const [confirmDeleteExpenseId, setConfirmDeleteExpenseId] = useState(null);
  const [newPersonName, setNewPersonName] = useState('');
  const [isOnline, setIsOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  const toastTimer = useRef(null);

  useEffect(() => {
    const goOnline = () => { setIsOnline(true); showToast('Back online — syncing'); };
    const goOffline = () => { setIsOnline(false); showToast("You're offline — changes will sync once you're back"); };
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
    };
  }, []);

  useEffect(() => {
    const check = () => {
      if (window.__firebaseReady) setFbReady(true);
      else setTimeout(check, 50);
    };
    check();
  }, []);

  // Invite links look like https://.../?code=K7QXP — auto-join straight in,
  // no manual typing needed. Runs once Firebase is ready, then cleans the
  // URL so the code doesn't linger in browser history if the link gets
  // reshared or bookmarked later.
  useEffect(() => {
    if (!fbReady) return;
    const params = new URLSearchParams(window.location.search);
    const codeFromUrl = params.get('code');
    if (codeFromUrl) {
      const clean = codeFromUrl.trim().toUpperCase();
      if (clean) jumpToTrip(clean);
      const url = new URL(window.location.href);
      url.searchParams.delete('code');
      window.history.replaceState(null, '', url.toString());
    }
  }, [fbReady]);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2000);
  };

  // Real-time listener: this is the whole sync mechanism. Any device that
  // writes to this trip doc updates every other open device automatically.
  useEffect(() => {
    if (!tripCode || !window.__firebase) return;
    const { db, doc, onSnapshot } = window.__firebase;
    setLoading(true);
    const unsub = onSnapshot(doc(db, 'trips', tripCode), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (!data.currency) data.currency = 'USD';
        setTrip(data);
        upsertHistory({ code: tripCode, name: data.name || null, currency: data.currency, lastVisited: Date.now() });
      } else {
        // A remembered code that no longer points to a real trip (deleted,
        // typo'd into storage some other way, etc). Don't get stuck on a
        // permanent loading screen — bounce back to the start screen.
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        setTripCode(null);
        setTrip(null);
        showToast("That trip couldn't be found — start or join again");
      }
      setLoading(false);
    }, (err) => {
      showToast('Connection issue — check your Firebase setup');
      setLoading(false);
    });
    return () => unsub();
  }, [tripCode]);

  const writeTrip = async (nextTrip) => {
    if (!window.__firebase || !tripCode) return;
    const { db, doc, setDoc } = window.__firebase;
    try {
      await setDoc(doc(db, 'trips', tripCode), nextTrip, { merge: false });
    } catch (e) {
      showToast("Couldn't save — check your connection");
    }
  };

  const rememberTrip = (code) => {
    try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
  };

  const upsertHistory = (entry) => {
    setTripHistory((prev) => {
      const filtered = prev.filter((e) => e.code !== entry.code);
      const next = [entry, ...filtered].slice(0, HISTORY_LIMIT);
      saveTripHistory(next);
      return next;
    });
  };

  const removeFromHistory = (code) => {
    setTripHistory((prev) => {
      const next = prev.filter((e) => e.code !== code);
      saveTripHistory(next);
      return next;
    });
  };

  const leaveTrip = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setTripCode(null);
    setTrip(null);
  };

  const createTrip = async () => {
    if (!window.__firebase) { showToast('Firebase is not configured yet'); return; }
    setLoading(true);
    const code = Array.from({ length: 5 }, () =>
      'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]
    ).join('');
    const { db, doc, setDoc } = window.__firebase;
    const name = newTripName.trim() || null;
    const pinnedCurrencies = [...newTripCurrencies];
    const startingCurrency = pinnedCurrencies[0] || 'USD';
    await setDoc(doc(db, 'trips', code), { ...EMPTY_TRIP, name, currency: startingCurrency, pinnedCurrencies });
    rememberTrip(code);
    upsertHistory({ code, name, currency: startingCurrency, lastVisited: Date.now() });
    setNewTripName('');
    setNewTripCurrencies([]);
    setTripCode(code);
  };

  const joinTrip = async () => {
    if (!window.__firebase) { showToast('Firebase is not configured yet'); return; }
    const c = codeInput.trim().toUpperCase();
    if (!c) return;
    setLoading(true);
    const { db, doc, getDoc } = window.__firebase;
    const snap = await getDoc(doc(db, 'trips', c));
    if (!snap.exists()) {
      setLoading(false);
      showToast('No trip found with that code');
      return;
    }
    const data = snap.data();
    rememberTrip(c);
    upsertHistory({ code: c, name: data.name || null, currency: data.currency || 'USD', lastVisited: Date.now() });
    setTripCode(c);
  };

  const jumpToTrip = async (code) => {
    if (!window.__firebase) { showToast('Firebase is not configured yet'); return; }
    setLoading(true);
    const { db, doc, getDoc } = window.__firebase;
    const snap = await getDoc(doc(db, 'trips', code));
    if (!snap.exists()) {
      setLoading(false);
      removeFromHistory(code);
      showToast('No trip found with that code');
      return;
    }
    const data = snap.data();
    rememberTrip(code);
    upsertHistory({ code, name: data.name || null, currency: data.currency || 'USD', lastVisited: Date.now() });
    setTripCode(code);
  };

  const mutate = (updater) => {
    if (!trip) return;
    const next = updater(trip);
    setTrip(next); // optimistic, onSnapshot will confirm it moments later
    writeTrip(next);
  };

  const addPerson = () => {
    const name = newPersonName.trim();
    if (!name) return;
    if (trip.people.some(p => p.toLowerCase() === name.toLowerCase())) {
      showToast('Already on the list'); return;
    }
    mutate(prev => ({ ...prev, people: [...prev.people, name] }));
    setNewPersonName('');
  };

  const removePerson = (name) => {
    mutate(prev => ({ ...prev, people: prev.people.filter(p => p !== name) }));
    setConfirmDeletePerson(null);
    showToast(`${name} removed`);
  };

  const requestRemovePerson = (name) => {
    if (confirmDeletePerson === name) {
      removePerson(name);
    } else {
      setConfirmDeletePerson(name);
      setConfirmDeleteExpenseId(null);
    }
  };

  const saveExpense = (expense) => {
    mutate(prev => {
      const exists = prev.expenses.some(e => e.id === expense.id);
      const nextExpenses = exists
        ? prev.expenses.map(e => (e.id === expense.id ? expense : e))
        : [...prev.expenses, expense];
      return { ...prev, expenses: nextExpenses };
    });
    showToast(editingExpense ? 'Expense updated' : 'Added to the tab');
  };

  const deleteExpense = (id) => {
    mutate(prev => {
      const target = prev.expenses.find(e => e.id === id);
      if (!target) return prev;
      return {
        ...prev,
        expenses: prev.expenses.filter(e => e.id !== id),
        archivedExpenses: [...(prev.archivedExpenses || []), { ...target, archivedAt: Date.now() }],
      };
    });
    setConfirmDeleteExpenseId(null);
    showToast('Expense archived');
  };

  const restoreExpense = (id) => {
    mutate(prev => {
      const target = (prev.archivedExpenses || []).find(e => e.id === id);
      if (!target) return prev;
      const { archivedAt, ...restored } = target;
      return {
        ...prev,
        archivedExpenses: (prev.archivedExpenses || []).filter(e => e.id !== id),
        expenses: [...prev.expenses, restored],
      };
    });
    showToast('Expense restored');
  };

  const requestDeleteExpense = (id) => {
    if (confirmDeleteExpenseId === id) {
      deleteExpense(id);
    } else {
      setConfirmDeleteExpenseId(id);
      setConfirmDeletePerson(null);
    }
  };
  const updateCurrency = (code) => mutate(prev => ({ ...prev, currency: code }));

  if (window.__pocketSplitNeedsSetup) {
    return (
      <div className="gate">
        <FanStack />
        <p className="eyebrow mono">POCKET SPLIT</p>
        <h2 className="display">Almost there</h2>
        <div className="setup-warning">
          Firebase isn't configured yet. Open <code>index.html</code>, find the
          <code> firebaseConfig </code> block near the top, and paste in your
          own project's config. See <code>SETUP.md</code> for the full
          walkthrough (~5 minutes).
        </div>
      </div>
    );
  }

  if (!fbReady) {
    return <div style={{ padding: 50, textAlign: 'center', color: 'var(--ink-faint)' }}>Loading…</div>;
  }

  if (!tripCode) {
    return (
      <>
      <div className="gate">
        <FanStack />
        <p className="eyebrow mono">POCKET SPLIT</p>
        <h2 className="display">Split it, don't sweat it</h2>
        <p>Start a new trip and share the code with your group — or join one they already started. Everyone with the code sees the same running tab, live.</p>
        <div className="field">
          <span className="field-label">Name this trip (optional)</span>
          <input
            type="text" placeholder="e.g. Goa 2026" value={newTripName}
            onChange={(e) => setNewTripName(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && createTrip()}
          />
        </div>
        <div className="field">
          <span className="field-label">Currencies you'll use (optional, up to 5)</span>
          <div className="pinned-chip-row">
            {newTripCurrencies.map((code) => (
              <div className="chip" key={code}>
                <span className="mono">{code}</span>
                <button onClick={() => setNewTripCurrencies((prev) => prev.filter((c) => c !== code))}>×</button>
              </div>
            ))}
            {newTripCurrencies.length < 5 && (
              <button className="add-currency-btn" onClick={() => setShowNewTripCurrencyPicker(true)}>+ Add</button>
            )}
          </div>
          {newTripCurrencies.length > 0 && (
            <div style={{ fontSize: 11.5, color: 'var(--ink-faint)', marginTop: 8 }}>
              First one picked ({newTripCurrencies[0]}) becomes the group's main currency — you can change this anytime.
            </div>
          )}
        </div>
        <button className="btn btn-primary" onClick={createTrip} disabled={loading}>
          Start a New Group
        </button>
        <div className="or-divider">or join with a code</div>
        <div className="field">
          <input
            type="text" placeholder="e.g. K7QXP" value={codeInput}
            onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
            style={{ textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 10 }}
            maxLength={8}
            onKeyDown={(e) => e.key === 'Enter' && joinTrip()}
          />
        </div>
        <button className="btn btn-outline" onClick={joinTrip} disabled={loading}>
          Join Group
        </button>

        {tripHistory.length > 0 && (
          <>
            <div className="section-title" style={{marginTop: 30}}>Groups</div>
            <div className="history-list">
              {tripHistory.map((h) => (
                <div className="history-item" key={h.code} onClick={() => jumpToTrip(h.code)}>
                  <div className="history-main">
                    <span className="history-name">{h.name || h.code}</span>
                    <span className="history-meta mono">{h.name ? h.code : ''} {h.name ? '·' : ''} {timeAgo(h.lastVisited)}</span>
                  </div>
                  <button
                    className="history-remove"
                    onClick={(e) => { e.stopPropagation(); removeFromHistory(h.code); }}
                    title="Remove from this list"
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>
          </>
        )}
      </div>

      {showNewTripCurrencyPicker && (
        <CurrencyPickerModal
          excludeCodes={newTripCurrencies}
          existingCount={newTripCurrencies.length}
          maxSelect={5}
          multiSelect
          title="Add currencies"
          onSelectMultiple={(codes) => {
            setNewTripCurrencies((prev) => [...prev, ...codes].slice(0, 5));
            setShowNewTripCurrencyPicker(false);
          }}
          onClose={() => setShowNewTripCurrencyPicker(false)}
        />
      )}
      </>
    );
  }

  if (loading || !trip) {
    return <div style={{ padding: 50, textAlign: 'center', color: 'var(--ink-faint)' }}>Loading trip…</div>;
  }

  const { people, expenses } = trip;
  const currency = trip.currency || 'USD';
  const symbol = symbolFor(currency);

  const inviteUrl = `${window.location.origin}${window.location.pathname}?code=${tripCode}`;
  const inviteText = trip.name ? `Join "${trip.name}" on Pocket Split` : 'Join my trip on Pocket Split';

  const shareInvite = async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Pocket Split', text: inviteText, url: inviteUrl });
      } catch (e) {
        // Person cancelled the native share sheet — nothing to do.
      }
    } else {
      setShowInviteFallback(true);
    }
  };

  const balances = {};
  people.forEach(p => balances[p] = 0);
  expenses.forEach(exp => {
    const share = exp.amount / exp.splitAmong.length;
    if (balances[exp.paidBy] === undefined) balances[exp.paidBy] = 0;
    balances[exp.paidBy] += exp.amount;
    exp.splitAmong.forEach(p => {
      if (balances[p] === undefined) balances[p] = 0;
      balances[p] -= share;
    });
  });

  const settlements = simplifySettlements(balances);
  const sortedPeople = [...people].sort((a, b) => (balances[b] || 0) - (balances[a] || 0));
  const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

  const paidTotals = {};
  people.forEach(p => paidTotals[p] = 0);
  expenses.forEach(exp => { paidTotals[exp.paidBy] = (paidTotals[exp.paidBy] || 0) + exp.amount; });
  const maxPaid = Math.max(1, ...people.map(p => paidTotals[p] || 0));
  const chartPeople = [...people].sort((a, b) => (paidTotals[b] || 0) - (paidTotals[a] || 0));

  const exportFileName = (ext) => {
    const base = (trip.name || tripCode).replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    return `pocket-split-${base}.${ext}`;
  };

  const exportCSV = () => {
    const header = ['Date', 'Description', `Amount (${currency})`, 'Original Amount', 'Original Currency', 'Paid By', 'Split Among'];
    const sorted = [...expenses].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const rows = sorted.map((e) => [
      e.ts ? new Date(e.ts).toISOString().slice(0, 10) : '',
      e.description || 'Expense',
      e.amount.toFixed(2),
      e.originalAmount != null ? e.originalAmount.toFixed(2) : '',
      e.originalCurrency || '',
      e.paidBy,
      e.splitAmong.join('; '),
    ]);
    const escapeCell = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = [header, ...rows].map((r) => r.map(escapeCell).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = exportFileName('csv');
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Excel file downloaded');
  };

  const exportPDF = () => {
    if (!window.jspdf) { showToast("PDF export isn't ready yet — try again in a moment"); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();

    // jsPDF's built-in fonts don't support most currency symbols (₹, ₩, etc.)
    // and silently corrupt them — using the plain currency code (INR, USD...)
    // sidesteps that entirely and reads clearly everywhere.
    const money = (n) => `${currency} ${Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    const BLUE = [26, 115, 232];
    const GREEN = [24, 128, 56];
    const INK = [32, 33, 36];
    const INK_DIM = [95, 99, 104];

    // Header band
    doc.setFillColor(...BLUE);
    doc.rect(0, 0, pageWidth, 30, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(19);
    doc.text(trip.name || 'Pocket Split', 14, 17);
    doc.setFontSize(9.5);
    doc.text(`Code ${tripCode}  ·  Generated ${new Date().toLocaleDateString()}`, 14, 24);

    let y = 42;
    doc.setTextColor(...INK_DIM);
    doc.setFontSize(10.5);
    doc.text('Total spent', 14, y);
    y += 9;
    doc.setTextColor(...INK);
    doc.setFontSize(22);
    doc.text(money(totalSpent), 14, y);
    y += 7;
    doc.setTextColor(...INK_DIM);
    doc.setFontSize(9.5);
    doc.text(`${money(totalSpent / (people.length || 1))} average per person`, 14, y);
    y += 12;

    doc.setTextColor(...INK);
    doc.setFontSize(12.5);
    doc.text('Balances', 14, y);
    y += 4;
    doc.autoTable({
      startY: y,
      head: [['Person', 'Status']],
      body: sortedPeople.map((p) => {
        const b = balances[p] || 0;
        const status = b === 0 ? 'Settled up' : b > 0 ? `Is owed ${money(b)}` : `Owes ${money(b)}`;
        return [p, status];
      }),
      theme: 'striped',
      headStyles: { fillColor: BLUE },
      styles: { fontSize: 10, textColor: INK },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 12;

    if (settlements.length > 0) {
      if (y > 250) { doc.addPage(); y = 20; }
      doc.setFontSize(12.5);
      doc.text('To settle up', 14, y);
      y += 4;
      doc.autoTable({
        startY: y,
        head: [['From', 'To', 'Amount']],
        body: settlements.map((s) => [s.from, s.to, money(s.amt)]),
        theme: 'grid',
        headStyles: { fillColor: GREEN },
        styles: { fontSize: 10, textColor: INK },
        columnStyles: { 2: { halign: 'right' } },
        margin: { left: 14, right: 14 },
      });
      y = doc.lastAutoTable.finalY + 12;
    }

    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFontSize(12.5);
    doc.text('Expenses', 14, y);
    y += 4;
    const sortedExpenses = [...expenses].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    doc.autoTable({
      startY: y,
      head: [['Date', 'Description', 'Amount', 'Paid By']],
      body: sortedExpenses.length > 0
        ? sortedExpenses.map((e) => [
            e.ts ? new Date(e.ts).toLocaleDateString() : '',
            e.description || 'Expense',
            money(e.amount),
            e.paidBy,
          ])
        : [['—', 'No expenses logged', '', '']],
      theme: 'striped',
      headStyles: { fillColor: BLUE },
      styles: { fontSize: 9, textColor: INK },
      columnStyles: { 2: { halign: 'right' } },
      margin: { left: 14, right: 14 },
    });

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(...INK_DIM);
      doc.text(`Pocket Split · Page ${i} of ${pageCount}`, pageWidth / 2, doc.internal.pageSize.getHeight() - 8, { align: 'center' });
    }

    doc.save(exportFileName('pdf'));
    showToast('PDF downloaded');
  };


  const formatExpenseDate = (ts) => {
    if (!ts) return '';
    const d = new Date(ts);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    if (isToday) return 'Today';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };

  return (
    <div>
      <div className="header">
        <FanStack />
        <h1 className="brand-title display">Pocket Split</h1>
        <div className="trip-name-row">
          {trip.name && <p className="trip-name-tag">{trip.name}</p>}
          <button className="switch-group-link" onClick={leaveTrip}>Switch group</button>
        </div>
        <div className="header-controls">
          <button className="pill invite-pill" onClick={shareInvite} style={{cursor: 'pointer'}}>
            Invite
          </button>
          <div className="pill">
            <span className={'live-dot' + (isOnline ? '' : ' offline')}></span>
            {isOnline ? 'CODE' : 'OFFLINE'}&nbsp;<strong>{tripCode}</strong>
            <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(tripCode); showToast('Code copied'); }}>copy</button>
          </div>
          <button className="settings-gear-btn" onClick={() => setShowTripSettings(true)} title="Group settings">⚙</button>
        </div>
      </div>

      {showInviteFallback && (
        <InviteFallbackModal
          url={inviteUrl}
          text={inviteText}
          showToast={showToast}
          onClose={() => setShowInviteFallback(false)}
        />
      )}

      {showTripSettings && (
        <TripSettingsModal
          tripName={trip.name}
          currency={currency}
          symbol={symbol}
          onOpenCurrencyPicker={() => { setShowTripSettings(false); setShowHeaderCurrencyPicker(true); }}
          onOpenManageCurrencies={() => { setShowTripSettings(false); setShowManageCurrencies(true); }}
          onExportCSV={() => { exportCSV(); setShowTripSettings(false); }}
          onExportPDF={() => { exportPDF(); setShowTripSettings(false); }}
          onClose={() => setShowTripSettings(false)}
        />
      )}

      {showHeaderCurrencyPicker && (
        <CurrencyPickerModal
          pinned={trip.pinnedCurrencies || []}
          title="Trip currency"
          onSelect={(code) => { updateCurrency(code); setShowHeaderCurrencyPicker(false); }}
          onClose={() => setShowHeaderCurrencyPicker(false)}
        />
      )}

      {showManageCurrencies && (
        <ManageCurrenciesModal
          pinned={trip.pinnedCurrencies || []}
          onSave={(list) => {
            mutate((prev) => ({ ...prev, pinnedCurrencies: list }));
            setShowManageCurrencies(false);
            showToast('Trip currencies updated');
          }}
          onClose={() => setShowManageCurrencies(false)}
        />
      )}

      {showArchive && (
        <ArchiveModal
          archivedExpenses={trip.archivedExpenses || []}
          symbol={symbol}
          onRestore={(id) => restoreExpense(id)}
          onClose={() => setShowArchive(false)}
        />
      )}

      <div className="body-pad">
        <div className="tab-bar">
          <button className={'tab-btn' + (activeTab === 'summary' ? ' active' : '')} onClick={() => setActiveTab('summary')}>Summary</button>
          <button className={'tab-btn' + (activeTab === 'expenses' ? ' active' : '')} onClick={() => setActiveTab('expenses')}>Expenses</button>
          <button className={'tab-btn' + (activeTab === 'people' ? ' active' : '')} onClick={() => setActiveTab('people')}>People</button>
        </div>

        {activeTab === 'summary' && (
          people.length === 0 ? (
            <div className="glass-card">
              <h3>Get started</h3>
              <p style={{fontSize: 13.5, color: 'var(--ink-dim)', margin: '0 0 14px'}}>
                Add everyone on the trip in the People tab, then start logging expenses.
              </p>
            </div>
          ) : (
            <div className="glass-card">
              <div className="total-spend-row">
                <span className="total-spend-label">Total spent</span>
                <span className="total-spend-amt mono">{fmt(totalSpent, symbol)}</span>
              </div>
              <div className="total-spend-sub">{fmt(totalSpent / people.length, symbol)} avg per person</div>

              {expenses.length > 0 && (
                <div className="spend-chart">
                  <h3 style={{marginTop: 18}}>Who's paid what</h3>
                  {chartPeople.map(p => {
                    const amt = paidTotals[p] || 0;
                    const pct = Math.max(4, Math.round((amt / maxPaid) * 100));
                    return (
                      <div className="spend-chart-row" key={p}>
                        <div className="spend-chart-labels">
                          <span className="spend-chart-name">{p}</span>
                          <span className="spend-chart-amt mono">{fmt(amt, symbol)}</span>
                        </div>
                        <div className="spend-chart-track">
                          <div className="spend-chart-fill" style={{width: pct + '%', background: colorForPerson(p, people)}}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <h3 style={{marginTop: 20}}>Who owes what</h3>
              {sortedPeople.map(p => {
                const b = balances[p] || 0;
                const cls = b > 0.005 ? 'amt-positive' : b < -0.005 ? 'amt-negative' : 'amt-zero';
                const label = b > 0.005 ? 'is owed' : b < -0.005 ? 'owes' : 'settled up';
                return (
                  <div className="balance-row" key={p}>
                    <div className="person-tag">
                      <div className="avatar" style={{background: colorForPerson(p, people)}}>{initials(p)}</div>
                      <span className="balance-name">{p}</span>
                    </div>
                    <span className={'balance-amt mono ' + cls}>
                      {b === 0 ? 'settled up' : `${label} ${fmt(Math.abs(b), symbol)}`}
                    </span>
                  </div>
                );
              })}

              {settlements.length > 0 && (
                <>
                  <h3 style={{marginTop: 20}}>To settle up</h3>
                  <div className="settle-list">
                    {settlements.map((s, i) => (
                      <div className="settle-item" key={i}>
                        <div className="avatar" style={{width: 22, height: 22, fontSize: 10, background: colorForPerson(s.from, people)}}>{initials(s.from)}</div>
                        <strong>{s.from}</strong>
                        <span className="settle-arrow">→</span>
                        <div className="avatar" style={{width: 22, height: 22, fontSize: 10, background: colorForPerson(s.to, people)}}>{initials(s.to)}</div>
                        <strong>{s.to}</strong>
                        <span className="settle-amt mono">{fmt(s.amt, symbol)}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          )
        )}

        {activeTab === 'people' && (
          <>
            <div className="section-title">People <span className="count">{people.length}</span></div>
            <div className="people-row">
              {people.map(p => (
                <div className="chip" key={p}>
                  <div className="avatar" style={{background: colorForPerson(p, people)}}>{initials(p)}</div>
                  {p}
                  {confirmDeletePerson === p ? (
                    <>
                      <button className="confirm-yes" onClick={() => requestRemovePerson(p)} title="Confirm remove">✓</button>
                      <button onClick={() => setConfirmDeletePerson(null)} title="Cancel">×</button>
                    </>
                  ) : (
                    <button onClick={() => requestRemovePerson(p)} title="Remove">×</button>
                  )}
                </div>
              ))}
            </div>
            <div className="add-person-row">
              <input
                type="text" placeholder="Add a person…" value={newPersonName}
                onChange={(e) => setNewPersonName(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && addPerson()}
              />
              <button onClick={addPerson}>+</button>
            </div>
          </>
        )}

        {activeTab === 'expenses' && (
          <>
            <div className="section-title" style={{justifyContent: 'space-between'}}>
              <span>Expenses <span className="count">{expenses.length}</span></span>
              {(trip.archivedExpenses || []).length > 0 && (
                <button className="archive-link" onClick={() => setShowArchive(true)}>
                  Archived ({(trip.archivedExpenses || []).length})
                </button>
              )}
            </div>
            {expenses.length === 0 ? (
              <div className="empty-state">No expenses logged yet. Tap "Add expense" below to start the tab.</div>
            ) : (
              [...expenses].reverse().map(exp => (
                <div
                  className="expense-ticket"
                  key={exp.id}
                  onClick={() => { setEditingExpense(exp); setShowAddExpense(true); }}
                >
                  <div className="expense-top">
                    <span className="expense-desc">{exp.description || 'Expense'}</span>
                    <span className="expense-amt mono">{fmt(exp.amount, symbol)}</span>
                  </div>
                  <div className="expense-meta">
                    {formatExpenseDate(exp.ts)} · Paid by <strong>{exp.paidBy}</strong> · split {exp.splitAmong.length} way{exp.splitAmong.length !== 1 ? 's' : ''} ({exp.splitAmong.join(', ')})
                  </div>
                  {exp.originalCurrency && (
                    <div className="expense-fx-note">
                      Originally {fmt(exp.originalAmount, symbolFor(exp.originalCurrency))} {exp.originalCurrency}
                      {exp.conversionRate ? ` · 1 ${exp.originalCurrency} = ${symbol}${exp.conversionRate.toFixed(4)}` : ''}
                    </div>
                  )}
                  {confirmDeleteExpenseId === exp.id ? (
                    <span className="expense-confirm-row" onClick={(e) => e.stopPropagation()}>
                      <span className="expense-confirm-text">Move to archive?</span>
                      <button className="expense-del confirm" onClick={() => requestDeleteExpense(exp.id)}>Yes, archive</button>
                      <button className="expense-del" onClick={() => setConfirmDeleteExpenseId(null)}>Cancel</button>
                    </span>
                  ) : (
                    <button
                      className="expense-del"
                      onClick={(e) => { e.stopPropagation(); requestDeleteExpense(exp.id); }}
                    >
                      archive
                    </button>
                  )}
                </div>
              ))
            )}
          </>
        )}
      </div>

      <div className="fab">
        <button className="btn btn-stamp" onClick={() => { setEditingExpense(null); setShowAddExpense(true); }} disabled={people.length === 0}>
          + Add expense
        </button>
      </div>

      {showAddExpense && (
        <AddExpenseModal
          people={people}
          symbol={symbol}
          tripCurrency={currency}
          pinnedCurrencies={trip.pinnedCurrencies || []}
          tripCode={tripCode}
          initial={editingExpense}
          onClose={() => { setShowAddExpense(false); setEditingExpense(null); }}
          onSave={(exp) => { saveExpense(exp); setShowAddExpense(false); setEditingExpense(null); }}
        />
      )}

      <div className={'toast' + (toast ? ' show' : '')}>{toast}</div>
    </div>
  );
}

function AddExpenseModal({ people, symbol, tripCurrency, pinnedCurrencies = [], tripCode, initial, onClose, onSave }) {
  const isEdit = !!initial;
  const [description, setDescription] = useState(initial ? initial.description : '');
  // If editing a foreign-currency expense, show the original typed amount/currency,
  // not the already-converted trip-currency amount — that's what the person expects to see.
  const [amount, setAmount] = useState(
    initial ? String(initial.originalAmount != null ? initial.originalAmount : initial.amount) : ''
  );
  const [expenseCurrency, setExpenseCurrency] = useState(() => {
    if (initial && initial.originalCurrency) return initial.originalCurrency;
    if (!isEdit) {
      // New expense: default to whatever currency was last used on this trip,
      // rather than always resetting to the trip's main currency.
      const remembered = getLastUsedCurrency(tripCode);
      if (remembered && CURRENCY_MAP[remembered]) return remembered;
    }
    return tripCurrency;
  });
  const [paidBy, setPaidBy] = useState(initial ? initial.paidBy : people[0]);
  const [splitAmong, setSplitAmong] = useState(initial ? [...initial.splitAmong] : [...people]);
  const [converting, setConverting] = useState(false);
  const [conversionError, setConversionError] = useState('');
  const [showCurrencyPicker, setShowCurrencyPicker] = useState(false);

  const toggle = (p) => setSplitAmong(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);
  const canSave = description.trim() && parseFloat(amount) > 0 && paidBy && splitAmong.length > 0 && !converting;
  const isForeign = expenseCurrency !== tripCurrency;
  const expenseSymbol = symbolFor(expenseCurrency);

  const save = async () => {
    if (!canSave) return;
    const typedAmount = parseFloat(amount);
    setConversionError('');
    setLastUsedCurrency(tripCode, expenseCurrency);

    if (!isForeign) {
      onSave({
        id: isEdit ? initial.id : uid(),
        description: description.trim(),
        amount: typedAmount,
        paidBy,
        splitAmong: [...splitAmong],
        ts: isEdit ? initial.ts : Date.now(),
        // clear any leftover foreign-currency fields if this was edited back to the trip currency
        // (Firestore rejects `undefined` values, so null is used here instead)
        originalAmount: null,
        originalCurrency: null,
        conversionRate: null,
      });
      return;
    }

    setConverting(true);
    try {
      const res = await fetch(`https://api.frankfurter.dev/v2/rate/${expenseCurrency}/${tripCurrency}`);
      if (!res.ok) throw new Error('rate fetch failed');
      const data = await res.json();
      const rate = data.rate;
      if (!rate) throw new Error('no rate in response');
      const converted = Math.round(typedAmount * rate * 100) / 100;
      onSave({
        id: isEdit ? initial.id : uid(),
        description: description.trim(),
        amount: converted,
        paidBy,
        splitAmong: [...splitAmong],
        ts: isEdit ? initial.ts : Date.now(),
        originalAmount: typedAmount,
        originalCurrency: expenseCurrency,
        conversionRate: rate,
      });
    } catch (e) {
      setConversionError("Couldn't fetch today's exchange rate — check your connection and try again.");
    } finally {
      setConverting(false);
    }
  };

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet">
        <h3 className="display">{isEdit ? 'Edit expense' : 'Add expense'}</h3>

        <div className="field">
          <span className="field-label">What was it</span>
          <input type="text" placeholder="e.g. Dinner at the taco place" value={description}
            onChange={(e) => setDescription(e.target.value)} autoFocus />
        </div>

        <div className="field">
          <span className="field-label">Amount</span>
          <div className="amount-currency-row">
            <div style={{position: 'relative', flex: 1}}>
              <span style={{position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', color: 'var(--ink-faint)', fontSize: 15, pointerEvents: 'none'}}>{expenseSymbol}</span>
              <input type="number" inputMode="decimal" placeholder="0.00" value={amount}
                onChange={(e) => setAmount(e.target.value)} style={{paddingLeft: 14 + (expenseSymbol.length * 9) + 6}} />
            </div>
            <button
              type="button"
              className="currency-select-btn"
              onClick={() => setShowCurrencyPicker(true)}
            >
              {expenseCurrency}
            </button>
          </div>
          {isForeign && !conversionError && (
            <div className="convert-hint">
              Will convert to {symbol} {tripCurrency} at today's exchange rate when you save.
            </div>
          )}
          {conversionError && (
            <div className="convert-error">{conversionError}</div>
          )}
        </div>

        {showCurrencyPicker && (
          <CurrencyPickerModal
            pinned={pinnedCurrencies}
            title="Expense currency"
            onSelect={(code) => { setExpenseCurrency(code); setShowCurrencyPicker(false); }}
            onClose={() => setShowCurrencyPicker(false)}
          />
        )}

        <div className="field">
          <span className="field-label">Who paid</span>
          <div className="payer-row">
            {people.map(p => (
              <button key={p} className={'select-chip' + (paidBy === p ? ' active' : '')} onClick={() => setPaidBy(p)}>
                <div className="avatar" style={{width: 18, height: 18, fontSize: 9, background: colorForPerson(p, people)}}>{initials(p)}</div>
                {p}
              </button>
            ))}
          </div>
        </div>

        <div className="field">
          <span className="field-label">Split among</span>
          <div className="split-list">
            {people.map(p => (
              <label className="split-row" key={p}>
                <input type="checkbox" checked={splitAmong.includes(p)} onChange={() => toggle(p)} />
                <div className="avatar" style={{width: 20, height: 20, fontSize: 9.5, background: colorForPerson(p, people)}}>{initials(p)}</div>
                {p}
              </label>
            ))}
          </div>
          <div style={{fontSize: 12, color: 'var(--ink-faint)', marginTop: 8}}>
            Uncheck anyone who's sitting this one out — the rest split it evenly.
          </div>
        </div>

        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={!canSave}>
            {converting ? 'Converting…' : (isEdit ? 'Save changes' : (isForeign ? 'Save & convert' : 'Save'))}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
