  .modal-sheet { background: var(--surface); border: 1px solid var(--border); border-bottom: none; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 24px 20px 28px; max-height: 86vh; overflow-y: auto; box-shadow: 0 -8px 30px rgba(32,33,36,0.12); }

  window.__pocketSplitNeedsSetup = needsSetup;

  if (!needsSetup) {

    // Persistent local cache (IndexedDB-backed): lets the app show the
    // last-synced balances/expenses when there's no connection, and lets
    // any writes made while offline queue durably — surviving a reload or

    // returns, at which point they sync automatically.

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

function uid() { return Math.random().toString(36).slice(2, 9); }

const CURRENCIES = [
  { code: 'USD', symbol: '$' }, { code: 'EUR', symbol: '€' }, { code: 'GBP', symbol: '£' },
  { code: 'INR', symbol: '₹' }, { code: 'JPY', symbol: '¥' }, { code: 'AUD', symbol: 'A$' },
  { code: 'CAD', symbol: 'C$' }, { code: 'SGD', symbol: 'S$' }, { code: 'AED', symbol: 'د.إ' },
  { code: 'THB', symbol: '฿' }, { code: 'MXN', symbol: 'Mex$' }, { code: 'CHF', symbol: 'CHF' },
];

const PERSON_COLORS = ['--p1', '--p2', '--p3', '--p4', '--p5', '--p6', '--p7', '--p8'];
function colorForPerson(name, people) {
  const idx = people.indexOf(name);
  return `var(${PERSON_COLORS[idx % PERSON_COLORS.length]})`;
}
function initials(name) { return name.trim().slice(0, 2).toUpperCase(); }
function symbolFor(code) { const c = CURRENCIES.find(c => c.code === code); return c ? c.symbol : '$'; }
function fmt(n, symbol) {
  const sign = n < 0 ? '-' : '';
  return sign + (symbol || '$') + Math.abs(n).toFixed(2);
}

function simplifySettlements(balances) {
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([name, amt]) => {
    if (amt > 0.005) creditors.push({ name, amt });
    else if (amt < -0.005) debtors.push({ name, amt: -amt });
  });
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    if (pay > 0.005) txns.push({ from: debtors[i].name, to: creditors[j].name, amt: pay });
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt < 0.005) i++;
    if (creditors[j].amt < 0.005) j++;
  }
  return txns;
}

function FanStack() {
  return (
    <div className="fan-stack">
      <div className="fan-card"></div>
      <div className="fan-card"></div>
      <div className="fan-card"></div>
      <div className="fan-card"></div>
    </div>
  );
}

const EMPTY_TRIP = { people: [], expenses: [], currency: 'USD' };
const STORAGE_KEY = 'pocketSplitTripCode';

function App() {
  const [fbReady, setFbReady] = useState(false);
  const [tripCode, setTripCode] = useState(() => {
    try { return localStorage.getItem(STORAGE_KEY) || null; } catch (e) { return null; }
  });
  const [codeInput, setCodeInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [trip, setTrip] = useState(null);
  const [toast, setToast] = useState('');
  const [showAddExpense, setShowAddExpense] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [confirmDeletePerson, setConfirmDeletePerson] = useState(null);
  const [confirmDeleteExpenseId, setConfirmDeleteExpenseId] = useState(null);
  const [newPersonName, setNewPersonName] = useState('');
  const [isOnline, setIsOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
  const toastTimer = useRef(null);

  useEffect(() => {
    const goOnline = () => { setIsOnline(true); showToast('Back online — syncing'); };
    const goOffline = () => { setIsOnline(false); showToast("You're offline — changes will sync once you're back"); };
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
    };
  }, []);

  useEffect(() => {
    const check = () => {
      if (window.__firebaseReady) setFbReady(true);
      else setTimeout(check, 50);
    };
    check();
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2000);
  };

  // Real-time listener: this is the whole sync mechanism. Any device that
  // writes to this trip doc updates every other open device automatically.
  useEffect(() => {
    if (!tripCode || !window.__firebase) return;
    const { db, doc, onSnapshot } = window.__firebase;
    setLoading(true);
    const unsub = onSnapshot(doc(db, 'trips', tripCode), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (!data.currency) data.currency = 'USD';
        setTrip(data);
      } else {
        // A remembered code that no longer points to a real trip (deleted,
        // typo'd into storage some other way, etc). Don't get stuck on a
        // permanent loading screen — bounce back to the start screen.
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        setTripCode(null);
        setTrip(null);
        showToast("That trip couldn't be found — start or join again");
      }
      setLoading(false);
    }, (err) => {
      showToast('Connection issue — check your Firebase setup');
      setLoading(false);
    });
    return () => unsub();
  }, [tripCode]);

  const writeTrip = async (nextTrip) => {
    if (!window.__firebase || !tripCode) return;
    const { db, doc, setDoc } = window.__firebase;
    try {
      await setDoc(doc(db, 'trips', tripCode), nextTrip, { merge: false });
    } catch (e) {
      showToast("Couldn't save — check your connection");
    }
  };

  const rememberTrip = (code) => {
    try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
  };

  const leaveTrip = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setTripCode(null);
    setTrip(null);
  };

  const createTrip = async () => {
    if (!window.__firebase) { showToast('Firebase is not configured yet'); return; }
    setLoading(true);
    const code = Array.from({ length: 5 }, () =>
      'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]
    ).join('');
    const { db, doc, setDoc } = window.__firebase;
    await setDoc(doc(db, 'trips', code), EMPTY_TRIP);
    rememberTrip(code);
    setTripCode(code);
  };

  const joinTrip = async () => {
    if (!window.__firebase) { showToast('Firebase is not configured yet'); return; }
    const c = codeInput.trim().toUpperCase();
    if (!c) return;
    setLoading(true);
    const { db, doc, getDoc } = window.__firebase;
    const snap = await getDoc(doc(db, 'trips', c));
    if (!snap.exists()) {
      setLoading(false);
      showToast('No trip found with that code');
      return;
    }
    rememberTrip(c);
    setTripCode(c);
  };


  const mutate = (updater) => {
    if (!trip) return;
    const next = updater(trip);
    setTrip(next); // optimistic, onSnapshot will confirm it moments later
    writeTrip(next);
  };

  const addPerson = () => {
    const name = newPersonName.trim();
    if (!name) return;
    if (trip.people.some(p => p.toLowerCase() === name.toLowerCase())) {
      showToast('Already on the list'); return;
    }
    mutate(prev => ({ ...prev, people: [...prev.people, name] }));
    setNewPersonName('');
  };

  const removePerson = (name) => {
    mutate(prev => ({ ...prev, people: prev.people.filter(p => p !== name) }));
    setConfirmDeletePerson(null);
    showToast(`${name} removed`);
  };

  const requestRemovePerson = (name) => {
    if (confirmDeletePerson === name) {
      removePerson(name);
    } else {
      setConfirmDeletePerson(name);
      setConfirmDeleteExpenseId(null);
    }
  };

  const saveExpense = (expense) => {
    mutate(prev => {
      const exists = prev.expenses.some(e => e.id === expense.id);
      const nextExpenses = exists
        ? prev.expenses.map(e => (e.id === expense.id ? expense : e))
        : [...prev.expenses, expense];
      return { ...prev, expenses: nextExpenses };
    });
    showToast(editingExpense ? 'Expense updated' : 'Added to the tab');
  };

  const deleteExpense = (id) => {
    mutate(prev => ({ ...prev, expenses: prev.expenses.filter(e => e.id !== id) }));
    setConfirmDeleteExpenseId(null);
    showToast('Expense removed');
  };

  const requestDeleteExpense = (id) => {
    if (confirmDeleteExpenseId === id) {
      deleteExpense(id);
    } else {
      setConfirmDeleteExpenseId(id);
      setConfirmDeletePerson(null);
    }
  };
  const updateCurrency = (code) => mutate(prev => ({ ...prev, currency: code }));

  if (window.__pocketSplitNeedsSetup) {
    return (
      <div className="gate">
        <FanStack />
        <p className="eyebrow mono">POCKET SPLIT</p>
        <h2 className="display">Almost there</h2>
        <div className="setup-warning">
          Firebase isn't configured yet. Open <code>index.html</code>, find the
          <code> firebaseConfig </code> block near the top, and paste in your
          own project's config. See <code>SETUP.md</code> for the full
          walkthrough (~5 minutes).
        </div>
      </div>
    );
  }

  if (!fbReady) {
    return <div style={{ padding: 50, textAlign: 'center', color: 'var(--ink-faint)' }}>Loading…</div>;
  }

  if (!tripCode) {
    return (
      <div className="gate">
        <FanStack />
        <p className="eyebrow mono">POCKET SPLIT</p>
        <h2 className="display">Split it, don't sweat it</h2>
        <p>Start a new trip and share the code with your group — or join one they already started. Everyone with the code sees the same running tab, live.</p>
        <button className="btn btn-primary" onClick={createTrip} disabled={loading}>
          Start a new trip
        </button>
        <div className="or-divider">or join with a code</div>
        <div className="field">
          <input
            type="text" placeholder="e.g. K7QXP" value={codeInput}
            onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
            style={{ textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 10 }}
            maxLength={8}
            onKeyDown={(e) => e.key === 'Enter' && joinTrip()}
          />
        </div>
        <button className="btn btn-outline" onClick={joinTrip} disabled={loading}>
          Join trip
        </button>
      </div>
    );
  }

  if (loading || !trip) {
    return <div style={{ padding: 50, textAlign: 'center', color: 'var(--ink-faint)' }}>Loading trip…</div>;
  }

  const { people, expenses } = trip;
  const currency = trip.currency || 'USD';
  const symbol = symbolFor(currency);

  const balances = {};
  people.forEach(p => balances[p] = 0);
  expenses.forEach(exp => {
    const share = exp.amount / exp.splitAmong.length;
    if (balances[exp.paidBy] === undefined) balances[exp.paidBy] = 0;
    balances[exp.paidBy] += exp.amount;
    exp.splitAmong.forEach(p => {
      if (balances[p] === undefined) balances[p] = 0;
      balances[p] -= share;
    });
  });

  const settlements = simplifySettlements(balances);
  const sortedPeople = [...people].sort((a, b) => (balances[b] || 0) - (balances[a] || 0));
  const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

  const formatExpenseDate = (ts) => {
    if (!ts) return '';
    const d = new Date(ts);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    if (isToday) return 'Today';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };

  return (
    <div>
      <div className="header">
        <FanStack />
        <h1 className="brand-title display">Pocket Split</h1>
        <div className="header-controls">
          <div className="pill">
            <span className={'live-dot' + (isOnline ? '' : ' offline')}></span>
            {isOnline ? 'CODE' : 'OFFLINE'}&nbsp;<strong>{tripCode}</strong>
            <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(tripCode); showToast('Code copied'); }}>copy</button>
          </div>
          <select className="pill mono" value={currency} onChange={(e) => updateCurrency(e.target.value)}>
            {CURRENCIES.map(c => (
              <option key={c.code} value={c.code}>{c.symbol} {c.code}</option>
            ))}
          </select>
          <button className="pill" onClick={leaveTrip} style={{cursor: 'pointer'}}>Switch trip</button>
        </div>
      </div>

      <div className="body-pad">
        {people.length === 0 ? (
          <div className="glass-card">
            <h3>Get started</h3>
            <p style={{fontSize: 13.5, color: 'var(--ink-dim)', margin: '0 0 14px'}}>
              Add everyone on the trip below, then start logging expenses.
            </p>
          </div>
        ) : (
          <div className="glass-card">
            <div className="total-spend-row">
              <span className="total-spend-label">Total spent</span>
              <span className="total-spend-amt mono">{fmt(totalSpent, symbol)}</span>
            </div>
            {people.length > 0 && (
              <div className="total-spend-sub">{fmt(totalSpent / people.length, symbol)} avg per person</div>
            )}
            <h3 style={{marginTop: 16}}>Who owes what</h3>
            {sortedPeople.map(p => {
              const b = balances[p] || 0;
              const cls = b > 0.005 ? 'amt-positive' : b < -0.005 ? 'amt-negative' : 'amt-zero';
              const label = b > 0.005 ? 'is owed' : b < -0.005 ? 'owes' : 'settled up';
              return (
                <div className="balance-row" key={p}>
                  <div className="person-tag">
                    <div className="avatar" style={{background: colorForPerson(p, people)}}>{initials(p)}</div>
                    <span className="balance-name">{p}</span>
                  </div>
                  <span className={'balance-amt mono ' + cls}>
                    {b === 0 ? 'settled up' : `${label} ${fmt(Math.abs(b), symbol)}`}
                  </span>
                </div>
              );
            })}

            {settlements.length > 0 && (
              <>
                <h3 style={{marginTop: 20}}>To settle up</h3>
                <div className="settle-list">
                  {settlements.map((s, i) => (
                    <div className="settle-item" key={i}>
                      <div className="avatar" style={{width: 22, height: 22, fontSize: 10, background: colorForPerson(s.from, people)}}>{initials(s.from)}</div>
                      <strong>{s.from}</strong>
                      <span className="settle-arrow">→</span>
                      <div className="avatar" style={{width: 22, height: 22, fontSize: 10, background: colorForPerson(s.to, people)}}>{initials(s.to)}</div>
                      <strong>{s.to}</strong>
                      <span className="settle-amt mono">{fmt(s.amt, symbol)}</span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        )}

        <div className="section-title">People <span className="count">{people.length}</span></div>
        <div className="people-row">
          {people.map(p => (
            <div className="chip" key={p}>
              <div className="avatar" style={{background: colorForPerson(p, people)}}>{initials(p)}</div>
              {p}
              {confirmDeletePerson === p ? (
                <>
                  <button className="confirm-yes" onClick={() => requestRemovePerson(p)} title="Confirm remove">✓</button>
                  <button onClick={() => setConfirmDeletePerson(null)} title="Cancel">×</button>
                </>
              ) : (
                <button onClick={() => requestRemovePerson(p)} title="Remove">×</button>
              )}
            </div>
          ))}
        </div>
        <div className="add-person-row">
          <input
            type="text" placeholder="Add a person…" value={newPersonName}
            onChange={(e) => setNewPersonName(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && addPerson()}
          />
          <button onClick={addPerson}>+</button>
        </div>

        <div className="section-title">Expenses <span className="count">{expenses.length}</span></div>
        {expenses.length === 0 ? (
          <div className="empty-state">No expenses logged yet. Tap "Add expense" below to start the tab.</div>
        ) : (
          [...expenses].reverse().map(exp => (
            <div
              className="expense-ticket"
              key={exp.id}
              onClick={() => { setEditingExpense(exp); setShowAddExpense(true); }}
            >
              <div className="expense-top">
                <span className="expense-desc">{exp.description || 'Expense'}</span>
                <span className="expense-amt mono">{fmt(exp.amount, symbol)}</span>
              </div>
              <div className="expense-meta">
                {formatExpenseDate(exp.ts)} · Paid by <strong>{exp.paidBy}</strong> · split {exp.splitAmong.length} way{exp.splitAmong.length !== 1 ? 's' : ''} ({exp.splitAmong.join(', ')})
              </div>
              {confirmDeleteExpenseId === exp.id ? (
                <span className="expense-confirm-row" onClick={(e) => e.stopPropagation()}>
                  <span className="expense-confirm-text">Remove this expense?</span>
                  <button className="expense-del confirm" onClick={() => requestDeleteExpense(exp.id)}>Yes, remove</button>
                  <button className="expense-del" onClick={() => setConfirmDeleteExpenseId(null)}>Cancel</button>
                </span>
              ) : (
                <button
                  className="expense-del"
                  onClick={(e) => { e.stopPropagation(); requestDeleteExpense(exp.id); }}
                >
                  remove
                </button>
              )}
            </div>
          ))
        )}
      </div>

      <div className="fab">
        <button className="btn btn-stamp" onClick={() => { setEditingExpense(null); setShowAddExpense(true); }} disabled={people.length === 0}>
          + Add expense
        </button>
      </div>

      {showAddExpense && (
        <AddExpenseModal
          people={people}
          symbol={symbol}
          initial={editingExpense}
          onClose={() => { setShowAddExpense(false); setEditingExpense(null); }}
          onSave={(exp) => { saveExpense(exp); setShowAddExpense(false); setEditingExpense(null); }}
        />
      )}

      <div className={'toast' + (toast ? ' show' : '')}>{toast}</div>
    </div>
  );
}

function AddExpenseModal({ people, symbol, initial, onClose, onSave }) {
  const isEdit = !!initial;
  const [description, setDescription] = useState(initial ? initial.description : '');
  const [amount, setAmount] = useState(initial ? String(initial.amount) : '');
  const [paidBy, setPaidBy] = useState(initial ? initial.paidBy : people[0]);
  const [splitAmong, setSplitAmong] = useState(initial ? [...initial.splitAmong] : [...people]);

  const toggle = (p) => setSplitAmong(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);
  const canSave = description.trim() && parseFloat(amount) > 0 && paidBy && splitAmong.length > 0;

  const save = () => {
    if (!canSave) return;
    onSave({
      id: isEdit ? initial.id : uid(),
      description: description.trim(),
      amount: parseFloat(amount),
      paidBy,
      splitAmong: [...splitAmong],
      ts: isEdit ? initial.ts : Date.now(),
    });
  };

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet">
        <h3 className="display">{isEdit ? 'Edit expense' : 'Add expense'}</h3>

        <div className="field">
          <span className="field-label">What was it</span>
          <input type="text" placeholder="e.g. Dinner at the taco place" value={description}
            onChange={(e) => setDescription(e.target.value)} autoFocus />
        </div>

        <div className="field">
          <span className="field-label">Amount</span>
          <div style={{position: 'relative'}}>
            <span style={{position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', color: 'var(--ink-faint)', fontSize: 15, pointerEvents: 'none'}}>{symbol}</span>
            <input type="number" inputMode="decimal" placeholder="0.00" value={amount}
              onChange={(e) => setAmount(e.target.value)} style={{paddingLeft: 14 + (symbol.length * 9) + 6}} />
          </div>
        </div>

        <div className="field">
          <span className="field-label">Who paid</span>
          <div className="payer-row">
            {people.map(p => (
              <button key={p} className={'select-chip' + (paidBy === p ? ' active' : '')} onClick={() => setPaidBy(p)}>
                <div className="avatar" style={{width: 18, height: 18, fontSize: 9, background: colorForPerson(p, people)}}>{initials(p)}</div>
                {p}
              </button>
            ))}
          </div>
        </div>

        <div className="field">
          <span className="field-label">Split among</span>
          <div className="split-list">
            {people.map(p => (
              <label className="split-row" key={p}>
                <input type="checkbox" checked={splitAmong.includes(p)} onChange={() => toggle(p)} />
                <div className="avatar" style={{width: 20, height: 20, fontSize: 9.5, background: colorForPerson(p, people)}}>{initials(p)}</div>
                {p}
              </label>
            ))}
          </div>
          <div style={{fontSize: 12, color: 'var(--ink-faint)', marginTop: 8}}>
            Uncheck anyone who's sitting this one out — the rest split it evenly.
          </div>
        </div>

        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={!canSave}>{isEdit ? 'Save changes' : 'Save'}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
